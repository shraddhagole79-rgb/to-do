spring.application.name=todo-backend

# Server Configuration
server.port=8080

# SQLite Database Configuration (stores database locally in todo.db)
spring.datasource.url=jdbc:sqlite:todo.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=9a3f2c4e6b8a1d7f5e3c2b1a4f6e8d0c9b7a5f3e1d2c4b6a8e0f2d4c6b8a1e3f
jwt.expiration-ms=86400000
